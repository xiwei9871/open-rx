name: baseline-validate

on:
  push:
  pull_request:

env:
  REDOCLY_VERSION: "1.25.15"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Baseline + traceability + disposition validation
        run: python3 tools/validate_baseline.py

      - name: Generated backlog drift check
        run: python3 tools/gen_backlog.py --check

      - name: OpenAPI lint (pinned)
        run: npx -y @redocly/cli@${{ env.REDOCLY_VERSION }} lint docs/api/openapi.yaml --max-problems 400

      - name: OpenAPI bundle for contract check
        run: npx -y @redocly/cli@${{ env.REDOCLY_VERSION }} bundle docs/api/openapi.yaml -o /tmp/openapi-bundle.json

      - name: MVP contract structure check
        run: python3 tools/validate_contract.py /tmp/openapi-bundle.json

      - name: Secret scan (tracked files)
        run: |
          set -e
          ! grep -rInE '(api[_-]?key|password|secret)[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9_\-]{16,}' \
            --exclude-dir=.git . || { echo "possible secret committed"; exit 1; }

      - name: PHI / banned file types
        run: |
          set -e
          ! git ls-files | grep -iE '\.(stl|dcm|dicom)$' || { echo "banned file type committed"; exit 1; }
