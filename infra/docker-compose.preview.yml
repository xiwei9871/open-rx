# EasyRS Private Preview — isolated production-style stack.
#
# Distinct compose project (easyrs-preview), dedicated volumes, and LAN-bound
# entry ports only. Nothing here shares containers, networks, volumes, or
# credentials with the dev stack or any other workload on the host.
#
# Public exposure happens ONLY through the operator-managed HTTPS ingress
# (lanproxy/external proxy) -> ${PREVIEW_BIND_IP}:${PREVIEW_WEB_PORT}.
# DB, Redis and RustFS admin/console ports are never published.
#
# Secrets come from infra/preview/.env.preview on the deploy host (chmod 600,
# never committed). See infra/preview/.env.preview.example.

name: easyrs-preview

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: easyrs_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}
      POSTGRES_DB: easyrs
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyrs_admin -d easyrs"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {memory: 1G, cpus: "1.0"}

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?required}
               --maxmemory 192mb --maxmemory-policy allkeys-lru
               --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: {memory: 256M, cpus: "0.5"}

  rustfs:
    # Pinned by digest — same verified S3 surface as dev/CI. On hosts where
    # docker.io is unreachable, preload the same digest via a mirror and set
    # RUSTFS_IMAGE to the local tag (digest verified at pull time).
    image: ${RUSTFS_IMAGE:-rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b}
    restart: unless-stopped
    command: rustfs /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?required}
      RUSTFS_CONSOLE_ENABLE: "false"
    # Browser-facing presigned endpoint. Bound to the LAN IP so the external
    # HTTPS ingress can reach it; NOT published to the internet directly.
    ports:
      - "${PREVIEW_BIND_IP}:${PREVIEW_S3_PORT}:9000"
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits: {memory: 512M, cpus: "0.5"}

  # One-shot: schema migrations + OPTIONAL controlled demo seed.
  # Demo seeding requires PREVIEW_DEMO_SEED=true AND the --token arg matching
  # PREVIEW_DEMO_TOKEN — both live only in the server-local env file.
  migrate:
    build:
      context: ../apps/api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: easyrs-api:${PREVIEW_IMAGE_TAG}
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://easyrs_app:${POSTGRES_APP_PASSWORD}@postgres:5432/easyrs
      DATABASE_ADMIN_URL: postgresql+asyncpg://easyrs_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/easyrs
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      SESSION_SECRET: ${SESSION_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      PREVIEW_DEMO_SEED: ${PREVIEW_DEMO_SEED:-false}
      PREVIEW_DEMO_TOKEN: ${PREVIEW_DEMO_TOKEN:-}
      PREVIEW_DEMO_ACCOUNTS: ${PREVIEW_DEMO_ACCOUNTS:-[]}
    command: >
      sh -c "alembic upgrade head &&
             if [ \"$$PREVIEW_DEMO_SEED\" = \"true\" ]; then
               python -m app.preview_seed --token \"$$PREVIEW_DEMO_TOKEN\";
             fi &&
             echo migrate_done"
    depends_on:
      postgres: {condition: service_healthy}
      rustfs: {condition: service_started}
    deploy:
      resources:
        limits: {memory: 1G, cpus: "1.0"}

  api:
    image: easyrs-api:${PREVIEW_IMAGE_TAG}
    build:
      context: ../apps/api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    restart: unless-stopped
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://easyrs_app:${POSTGRES_APP_PASSWORD}@postgres:5432/easyrs
      DATABASE_ADMIN_URL: ""          # runtime never holds the RLS-exempt role
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT_URL: http://rustfs:9000
      # presigned URLs are dialed by the browser — public HTTPS endpoint,
      # never localhost on the preview
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:?required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      SESSION_SECRET: ${SESSION_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?required}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-104857600}
      # Prod-tight rate limits — no dev overrides in the preview.
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      rustfs: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 1G, cpus: "1.0"}

  web:
    image: easyrs-web:${PREVIEW_IMAGE_TAG}
    build:
      context: ../apps/web
      args:
        VITE_DEMO: "1"
        VITE_APP_VERSION: ${PREVIEW_IMAGE_TAG}
    restart: unless-stopped
    # LAN-bound entry: the external HTTPS ingress proxies here. Loopback-only
    # would hide it from the lanproxy client; the LAN port is intentional.
    ports:
      - "${PREVIEW_BIND_IP}:${PREVIEW_WEB_PORT}:80"
    depends_on:
      - api
    deploy:
      resources:
        limits: {memory: 128M, cpus: "0.5"}

volumes:
  pgdata:
  redisdata:
  rustfsdata:
